# Interface created for the tunnel. Creating it needs CAP_NET_ADMIN, so run with sudo.
tun.name=tun0
tun.address=10.0.0.1/24
tun.mtu=1400

# true  -> route 0.0.0.0/1 and 128.0.0.0/1 into the tunnel, which intercepts every
#          non-local IPv4 packet and stops this machine's internet until exit.
# false -> only tun.address's own subnet reaches the tunnel, so the internet keeps working.
tun.hijackDefaultRoute=true

server.host=127.0.0.1
server.port=5000

# 32 random bytes, base64. Generate with: openssl rand -base64 32
# Must match the server's value, or every packet fails its authentication tag.
crypto.key.base64=REPLACE_ME

# Console progress is printed every N forwarded packets.
progress.interval=100
